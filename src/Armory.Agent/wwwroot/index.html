<!doctype html>
<html lang="en" data-theme="idea">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Nothing leaves this folder: no network, no web fonts, no remote images. -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src 'self' file: data:; base-uri 'none'; form-action 'none'"
		/>
		<meta name="color-scheme" content="dark light" />
		<title>Armory</title>
		<link rel="stylesheet" href="app.css" />
		<script src="bridge.js"></script>
	</head>
	<body class="preload">
		<!-- Icons, drawn once and used by reference. Strokes take the ink of the text
		     around them, so every icon follows the theme. -->
		<svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
			<defs>
				<!-- The IDEA emblem, as idea-app ships it (static/IDEA/favicon.svg): an
				     identity color, so it looks the same in every theme. -->
				<linearGradient id="emblem-pl" x1="0" y1="0" x2="0" y2="1">
					<stop offset="0" stop-color="#3C7A4C" />
					<stop offset="1" stop-color="#1F4A2C" />
				</linearGradient>
				<linearGradient id="emblem-st" x1="0" y1="0" x2="1" y2="1">
					<stop offset="0" stop-color="#CBD2C4" />
					<stop offset="1" stop-color="#87928A" />
				</linearGradient>
				<symbol id="i-emblem" viewBox="0 0 512 512">
					<path d="M 69.12 168.96 L 442.88 168.96 L 486.4 212.48 L 486.4 299.52 L 442.88 343.04 L 69.12 343.04 L 25.6 299.52 L 25.6 212.48 Z" fill="url(#emblem-pl)" stroke="#0A0F0B" stroke-width="15.4" stroke-linejoin="round" />
					<path d="M 81.408 189.44 L 430.592 189.44 M 81.408 322.56 L 430.592 322.56" fill="none" stroke="#9FE29A" stroke-opacity="0.9" stroke-width="11.3" />
					<path d="M 215.9 125.6 L 222.9 74.7 L 289.1 74.7 L 296.1 125.6 L 319.8 135.5 L 360.8 104.4 L 407.6 151.2 L 376.5 192.2 L 386.4 215.9 L 437.3 222.9 L 437.3 289.1 L 386.4 296.1 L 376.5 319.8 L 407.6 360.8 L 360.8 407.6 L 319.8 376.5 L 296.1 386.4 L 289.1 437.3 L 222.9 437.3 L 215.9 386.4 L 192.2 376.5 L 151.2 407.6 L 104.4 360.8 L 135.5 319.8 L 125.6 296.1 L 74.7 289.1 L 74.7 222.9 L 125.6 215.9 L 135.5 192.2 L 104.4 151.2 L 151.2 104.4 L 192.2 135.5 Z M 171.2 256.0 A 84.8 84.8 0 1 0 340.8 256.0 A 84.8 84.8 0 1 0 171.2 256.0 Z" fill-rule="evenodd" fill="url(#emblem-st)" stroke="#0A0F0B" stroke-width="15.4" stroke-linejoin="round" />
					<circle cx="256" cy="256" r="77.1" fill="url(#emblem-pl)" />
				</symbol>
				<symbol id="i-folder" viewBox="0 0 16 16"><path d="M1.75 4.25a1 1 0 0 1 1-1h3.5l1.5 1.5h5.5a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1H2.75a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" /></symbol>
				<symbol id="i-settings" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4h6.5M12.5 4H14M2 8h1.5M7.5 8H14M2 12h8.5M14.5 12H14" /><circle cx="10.5" cy="4" r="1.6" /><circle cx="5.5" cy="8" r="1.6" /><circle cx="12.5" cy="12" r="1.6" /></g></symbol>
				<symbol id="i-chev-right" viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-chev-left" viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-check" viewBox="0 0 16 16"><path d="m3.5 8.5 3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-pause" viewBox="0 0 16 16"><path d="M5.5 3.5v9M10.5 3.5v9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></symbol>
				<symbol id="i-play" viewBox="0 0 16 16"><path d="M5 3.5v9l7-4.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" /></symbol>
				<symbol id="i-signout" viewBox="0 0 16 16"><path d="M6.5 2.5h-3v11h3M10 5l3 3-3 3M13 8H6.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-note" viewBox="0 0 16 16"><path d="M8 2.25 14.5 13.5h-13zM8 6.5v3.25M8 11.75v.01" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-part" viewBox="0 0 20 20"><path d="M10 2.5 16.5 6v8L10 17.5 3.5 14V6zM3.5 6 10 9.5 16.5 6M10 9.5v8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" /></symbol>
				<!-- An assembly is two parts mated, so it never reads as the one-cube part at 20px. -->
				<symbol id="i-asm" viewBox="0 0 20 20"><path d="M6.2 8.3 10.18 10.6v4.6L6.2 17.5l-3.98-2.3v-4.6zM2.22 10.6 6.2 12.9l3.98-2.3M6.2 12.9v4.6M13.8 2.5l3.98 2.3v4.6l-3.98 2.3-3.98-2.3V4.8zM9.82 4.8l3.98 2.3 3.98-2.3M13.8 7.1v4.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" /></symbol>
				<symbol id="i-drw" viewBox="0 0 20 20"><path d="M4.5 2.5h7l4 4v11h-11zM11.5 2.5v4h4M7 10.5h6M7 13.5h4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" /></symbol>
				<symbol id="i-file" viewBox="0 0 20 20"><path d="M4.5 2.5h7l4 4v11h-11zM11.5 2.5v4h4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" /></symbol>
				<!-- Needs-you glyphs: a newer version coming down, a kept copy (two sheets), a
				     file that can't be sent, a version that couldn't be checked. -->
				<symbol id="i-newer" viewBox="0 0 20 20"><path d="M10 2.75v9.5M6 8.75l4 4 4-4M3.75 13.5v3h12.5v-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-copy" viewBox="0 0 20 20"><path d="M7.5 2.5h5l3.5 3.5v8.5H7.5zM12.5 2.5V6H16M4.5 5.5v12H13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" /></symbol>
				<symbol id="i-cant" viewBox="0 0 20 20"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="10" cy="10" r="6.75" /><path d="m5.25 5.25 9.5 9.5" /></g></symbol>
				<symbol id="i-question" viewBox="0 0 20 20"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7.25" /><path d="M7.75 7.9a2.3 2.3 0 1 1 3.2 2.1c-.6.27-.95.8-.95 1.45v.55M10 14.3v.05" /></g></symbol>
			</defs>
		</svg>
		<div class="window plate-slab" id="window">
			<header class="plate-header">
				<div class="brand">
					<svg class="emblem" aria-hidden="true" focusable="false"><use href="#i-emblem" /></svg>
					<span class="brand-word">Armory</span>
				</div>
				<div class="header-keys" id="header-keys"></div>
			</header>
			<div class="scroller" id="scroller">
				<main id="main" class="screen-root"></main>
			</div>
		</div>
		<dialog id="settings" class="housing" tabindex="-1" aria-labelledby="settings-title"></dialog>
		<noscript><p>Armory needs JavaScript turned on in this window.</p></noscript>
		<script src="app.js"></script>
	</body>
</html>
