<!doctype html>
<html lang="en" data-theme="idea">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Nothing leaves this folder: no network, no web fonts, no remote images. -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src 'self' file: data:; base-uri 'none'; form-action 'none'"
		/>
		<meta name="color-scheme" content="dark light" />
		<title>Armory</title>
		<link rel="stylesheet" href="app.css" />
		<script src="bridge.js"></script>
	</head>
	<body class="preload">
		<!-- Icons, drawn once and used by reference. Strokes take the ink of the text
		     around them, so every icon follows the theme. -->
		<svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
			<defs>
				<symbol id="i-folder" viewBox="0 0 16 16"><path d="M1.75 4.25a1 1 0 0 1 1-1h3.5l1.5 1.5h5.5a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1H2.75a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" /></symbol>
				<symbol id="i-settings" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4h6.5M12.5 4H14M2 8h1.5M7.5 8H14M2 12h8.5M14.5 12H14" /><circle cx="10.5" cy="4" r="1.6" /><circle cx="5.5" cy="8" r="1.6" /><circle cx="12.5" cy="12" r="1.6" /></g></symbol>
				<symbol id="i-chev-right" viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-chev-down" viewBox="0 0 16 16"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<!-- A folder with an arrow out of it: this row opens its folder, not a page. -->
				<symbol id="i-folder-go" viewBox="0 0 16 16"><path d="M1.75 4.25a1 1 0 0 1 1-1h3.5l1.5 1.5h5.5a1 1 0 0 1 1 1v2M7.5 12.75H2.75a1 1 0 0 1-1-1v-7.5M10 11.5h4.5M12.5 9.25l2 2.25-2 2.25" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-chev-left" viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-check" viewBox="0 0 16 16"><path d="m3.5 8.5 3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-pause" viewBox="0 0 16 16"><path d="M5.5 3.5v9M10.5 3.5v9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></symbol>
				<symbol id="i-play" viewBox="0 0 16 16"><path d="M5 3.5v9l7-4.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" /></symbol>
				<symbol id="i-signout" viewBox="0 0 16 16"><path d="M6.5 2.5h-3v11h3M10 5l3 3-3 3M13 8H6.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-note" viewBox="0 0 16 16"><path d="M8 2.25 14.5 13.5h-13zM8 6.5v3.25M8 11.75v.01" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-part" viewBox="0 0 20 20"><path d="M10 2.5 16.5 6v8L10 17.5 3.5 14V6zM3.5 6 10 9.5 16.5 6M10 9.5v8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" /></symbol>
				<!-- An assembly is two parts mated, so it never reads as the one-cube part at 20px. -->
				<symbol id="i-asm" viewBox="0 0 20 20"><path d="M6.2 8.3 10.18 10.6v4.6L6.2 17.5l-3.98-2.3v-4.6zM2.22 10.6 6.2 12.9l3.98-2.3M6.2 12.9v4.6M13.8 2.5l3.98 2.3v4.6l-3.98 2.3-3.98-2.3V4.8zM9.82 4.8l3.98 2.3 3.98-2.3M13.8 7.1v4.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" /></symbol>
				<symbol id="i-drw" viewBox="0 0 20 20"><path d="M4.5 2.5h7l4 4v11h-11zM11.5 2.5v4h4M7 10.5h6M7 13.5h4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" /></symbol>
				<symbol id="i-file" viewBox="0 0 20 20"><path d="M4.5 2.5h7l4 4v11h-11zM11.5 2.5v4h4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" /></symbol>
				<!-- Needs-you glyphs: a newer version coming down, a kept copy (two sheets), a
				     file that can't be sent, a version that couldn't be checked. -->
				<symbol id="i-newer" viewBox="0 0 20 20"><path d="M10 2.75v9.5M6 8.75l4 4 4-4M3.75 13.5v3h12.5v-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-copy" viewBox="0 0 20 20"><path d="M7.5 2.5h5l3.5 3.5v8.5H7.5zM12.5 2.5V6H16M4.5 5.5v12H13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" /></symbol>
				<symbol id="i-cant" viewBox="0 0 20 20"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="10" cy="10" r="6.75" /><path d="m5.25 5.25 9.5 9.5" /></g></symbol>
				<!-- v2: the file actions and what is moving. Check out is a pencil (taking a file
				     to change it); check in is an arrow up into the team's tray; take back pulls
				     a file round to you. Uploading, downloading and moving are arrows. -->
				<symbol id="i-open" viewBox="0 0 16 16"><path d="M9.5 2.5h4v4M13.5 2.5 7.5 8.5M12 9.5v3a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-checkout" viewBox="0 0 16 16"><path d="M10.6 2.6a1.3 1.3 0 0 1 1.85 0l.95.95a1.3 1.3 0 0 1 0 1.85L6 12.8l-3.4.6.6-3.4zM9.4 3.8l2.8 2.8M2.5 15h11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-checkin" viewBox="0 0 16 16"><path d="M8 10.5V2.5M5 5.5l3-3 3 3M2.5 9.5v4h11v-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-undo" viewBox="0 0 16 16"><path d="M5.5 3.5 2.5 6.5l3 3M2.5 6.5h7a4 4 0 0 1 0 8H7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-takeback" viewBox="0 0 16 16"><path d="M13.5 8A5.5 5.5 0 1 1 11.2 3.5M11.5 1v3h-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="8" cy="8" r="1.4" fill="currentColor" /></symbol>
				<symbol id="i-newfolder" viewBox="0 0 16 16"><path d="M1.75 4.25a1 1 0 0 1 1-1h3.5l1.5 1.5h5.5a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1H2.75a1 1 0 0 1-1-1zM8 7v4M6 9h4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-addfile" viewBox="0 0 16 16"><path d="M9 1.75H4a1 1 0 0 0-1 1v10.5a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V5.75zM9 1.75v4h4M8 7.5v4.5M5.75 9.75h4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-rename" viewBox="0 0 16 16"><path d="M2 4.5h7M2 8h4.5M2 11.5h3.5M11.5 3v10M10 3h3M10 13h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-trash" viewBox="0 0 16 16"><path d="M2.5 4.5h11M6.5 4.5v-2h3v2M4 4.5l.7 9a1 1 0 0 0 1 .9h4.6a1 1 0 0 0 1-.9l.7-9M6.75 7v4.75M9.25 7v4.75" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-up" viewBox="0 0 16 16"><path d="M8 13.5v-11M3.5 7 8 2.5 12.5 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-down" viewBox="0 0 16 16"><path d="M8 2.5v11M3.5 9 8 13.5 12.5 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-move" viewBox="0 0 16 16"><path d="M2 8h11.5M9.5 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-clock" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6" /><path d="M8 4.5V8l2.5 1.5" /></g></symbol>
				<symbol id="i-archive" viewBox="0 0 20 20"><path d="M2.75 3.5h14.5v3.5H2.75zM4 7v9.5h12V7M8 10h4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-import" viewBox="0 0 20 20"><path d="M10 2.75v9.5M6 8.25l4 4 4-4M3.75 12.5v4h12.5v-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-names" viewBox="0 0 20 20"><path d="M4.5 2.5h5l3 3v6h-8zM9.5 2.5v3h3M7.5 8.5v9h8v-6.5l-2-2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-folder-back" viewBox="0 0 20 20"><path d="M2.5 5.25a1 1 0 0 1 1-1h4.25l1.75 1.75h7a1 1 0 0 1 1 1v8.75a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1zM12.5 9.25l-2.75 2.5 2.75 2.5M9.75 11.75H15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-person" viewBox="0 0 20 20"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="7" r="3.25" /><path d="M3.75 17c.6-3.4 3.2-5.25 6.25-5.25s5.65 1.85 6.25 5.25" /></g></symbol>
				<!-- Send feedback (v0.3): a speech bubble with two lines of words in it. -->
				<symbol id="i-feedback" viewBox="0 0 16 16"><path d="M2.75 2.75h10.5a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1H7l-3.25 2.5v-2.5h-1a1 1 0 0 1-1-1v-6.5a1 1 0 0 1 1-1zM4.75 5.75h6.5M4.75 8.25h4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
				<symbol id="i-question" viewBox="0 0 20 20"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7.25" /><path d="M7.75 7.9a2.3 2.3 0 1 1 3.2 2.1c-.6.27-.95.8-.95 1.45v.55M10 14.3v.05" /></g></symbol>
			</defs>
		</svg>
		<div class="window plate-slab" id="window">
			<header class="plate-header">
				<!-- The IDEA lockup (the gear turning behind the plate, as ideabosco.com draws it;
				     app.css paints both layers), a thin rule, then this window's name. -->
				<div class="brand">
					<span class="wordmark" role="img" aria-label="IDEA"></span>
					<span class="brand-rule" aria-hidden="true"></span>
					<span class="brand-word">Armory</span>
				</div>
				<div class="header-keys" id="header-keys"></div>
			</header>
			<div class="scroller" id="scroller">
				<main id="main" class="screen-root"></main>
			</div>
			<!-- "More below": a fade and a small tag at the window's foot while the window
			     has more to scroll to. Paint only; app.js fills in the count. -->
			<div class="scroll-cue window-cue" id="window-cue" data-on="false" aria-hidden="true"><span class="cue-chip"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-chev-down" /></svg><span class="cue-word"></span></span></div>
			<!-- What the host said about the last action ("Checked out Plate-Left.SLDPRT."),
			     quietly: a small tag at the window's foot, read out by a screen reader, never
			     taking focus or a click. app.js fills it and lets it fade. -->
			<div class="result-line" id="result" role="status" aria-live="polite" data-on="false"><span class="result-chip"><span class="spin" aria-hidden="true"></span><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-check" /></svg><span class="result-word" id="result-word"></span></span></div>
		</div>
		<dialog id="settings" class="housing" tabindex="-1" aria-labelledby="settings-title"></dialog>
		<!-- New folder, Rename folder, Delete folder and Take back ask here. Filled once when
		     it opens and never redrawn by a host update, so typed words stay put. -->
		<dialog id="ask" class="housing ask" tabindex="-1" aria-labelledby="ask-title"></dialog>
		<noscript><p>Armory needs JavaScript turned on in this window.</p></noscript>
		<script src="app.js"></script>
	</body>
</html>
