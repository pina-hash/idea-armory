name: Build and package the IDEA Armory agent
description: >-
  Restores with the lock files, builds with warnings as errors, builds the native parts with
  Visual Studio's compilers (the badge handlers and the right-click forwarder), runs the agent's
  tests (which find that native build), publishes the self-contained win-x64 app, and builds the
  badges setup, the flash-drive zip and the per-user installer into dist/ with a .sha256 file
  beside each. Used by agent.yml and release.yml after actions/checkout, on windows-latest.
outputs:
  version:
    description: The agent version, the Version of src/Armory.Agent.
    value: ${{ steps.package.outputs.version }}
  usb-zip:
    description: Path of dist/IDEA-Armory-USB-v<version>.zip.
    value: ${{ steps.package.outputs.usb_zip }}
  usb-sha256:
    description: SHA-256 of the flash-drive zip.
    value: ${{ steps.package.outputs.usb_sha256 }}
  setup-exe:
    description: Path of dist/IDEA-Armory-Setup-v<version>.exe.
    value: ${{ steps.package.outputs.setup_exe }}
  setup-sha256:
    description: SHA-256 of the installer.
    value: ${{ steps.package.outputs.setup_sha256 }}
  badges-exe:
    description: Path of dist/IDEA-Armory-Badges-Setup-v<version>.exe, the optional administrator step.
    value: ${{ steps.package.outputs.badges_exe }}
  badges-sha256:
    description: SHA-256 of the badges setup.
    value: ${{ steps.package.outputs.badges_sha256 }}
  arm64:
    description: true when the badges setup carries the ARM64 DLL too.
    value: ${{ steps.package.outputs.arm64 }}
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Restore with the lock files
      shell: pwsh
      run: dotnet restore --locked-mode

    - name: Build (warnings are errors)
      shell: pwsh
      run: dotnet build --no-restore -warnaserror

    # MSVC from the image's Visual Studio: ArmoryBadges.dll (x64, and ARM64 when its C++ tools
    # are there; else a warning), ArmoryShell.exe, and the test tools BadgeProbe.exe and
    # ShellPipeTest.exe, into publish/native. Imports and version resources are checked.
    - name: Native parts (badge handlers, the right-click forwarder) with Visual Studio's compilers
      shell: pwsh
      run: ./tools/build-native.ps1 -OutDir publish/native

    - name: Agent tests
      shell: pwsh
      run: dotnet test tests/Armory.Agent.Tests --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=agent-tests.trx"

    # The restore inside publish adds empty win-x64 sections to the referenced projects'
    # lock files on the runner; package versions stay the ones the locked restore proved.
    - name: Publish the self-contained win-x64 app
      shell: pwsh
      run: dotnet publish src/Armory.Agent -c Release -r win-x64 --self-contained true -o publish/agent

    - name: Inno Setup 6.3 or later
      shell: pwsh
      run: |
        . ./tools/inno-setup.ps1
        $iscc = Find-Iscc
        $found = $null
        if ($iscc) { $found = Get-IsccVersion $iscc }
        if (-not $iscc) {
          Write-Host 'Inno Setup is not on this runner; installing it with Chocolatey.'
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed with exit code $LASTEXITCODE" }
        } elseif (-not $found.Version -or $found.Version -lt [version]'6.3') {
          Write-Host ('Inno Setup reads as ' + $found.Version + ' (' + ($found.Seen -join '; ') + '); upgrading it with Chocolatey.')
          choco upgrade innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "choco upgrade innosetup failed with exit code $LASTEXITCODE" }
        }
        $iscc = Find-Iscc
        if (-not $iscc) { throw 'ISCC.exe was not found after installing Inno Setup.' }
        $found = Get-IsccVersion $iscc
        Write-Host ('Version readings: ' + ($found.Seen -join '; '))
        if ($found.Version -and $found.Version -lt [version]'6.3') { throw ('Inno Setup ' + $found.Version + ' is older than 6.3 after the upgrade.') }
        if (-not $found.Version) { Write-Host '::warning::The Inno Setup version could not be read; ISCC itself refuses directives it does not know.' }
        Write-Host ('Inno Setup ' + $found.Version + ' (from ' + $found.Source + '): ' + $iscc)
        "ARMORY_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Package the badges setup, the flash-drive zip and the installer
      id: package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force evidence | Out-Null
        ./tools/package-agent.ps1 -PublishDir publish/agent -NativeDir publish/native -OutDir dist | Tee-Object -FilePath evidence/package.txt
