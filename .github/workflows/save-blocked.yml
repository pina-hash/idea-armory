name: Blocked save Windows evidence
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  save-blocked:
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2, 3, 4]
    name: save-blocked (${{ matrix.batch }}, 5 repeats)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore tests/Armory.Agent.Tests --locked-mode
      - run: dotnet restore tests/Armory.Platform.Windows.Tests --locked-mode
      - run: dotnet restore tests/Armory.Agent.Engine.Tests --locked-mode
      - run: dotnet build tests/Armory.Agent.Tests --no-restore -warnaserror
      - run: dotnet build tests/Armory.Platform.Windows.Tests --no-restore -warnaserror
      - run: dotnet build tests/Armory.Agent.Engine.Tests --no-restore -warnaserror
      - name: Five repetitions of the protection, burst and real COM save tests (20 total)
        shell: pwsh
        run: |
          $projects = @('Armory.Platform.Windows.Tests', 'Armory.Agent.Engine.Tests', 'Armory.Agent.Tests')
          foreach ($repeat in 1..5) {
            foreach ($project in $projects) {
              dotnet test "tests/$project" --no-build --filter FullyQualifiedName~SaveBlocked --logger "console;verbosity=detailed" --logger "trx;LogFileName=save-blocked-$repeat.trx"
              if ($LASTEXITCODE -ne 0) { throw "$project failed in repeat $repeat of batch ${{ matrix.batch }}" }
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: save-blocked-windows-${{ matrix.batch }}
          path: tests/**/TestResults/save-blocked*.trx
